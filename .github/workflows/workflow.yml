name: CI Pipeline

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install flake8 nose
      - name: Lint with flake8
        run: |
          flake8 . --count --max-line-length=127 --extend-ignore=E302,W291,W293,W292,E501,W503 --exclude=.git,__pycache__ --statistics
      - name: Test with nose
        run: nosetests -v
